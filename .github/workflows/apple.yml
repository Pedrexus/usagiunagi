name: Apple CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
  SWIFT_TESTING_XCTEST_INTEROP_MODE: complete

defaults:
  run:
    shell: bash

jobs:
  shared:
    name: Shared logic and persistence
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: phvv-me/mainboard
          ref: 7acaf736c8bae16f8b028678384fe83bb728c51b
          path: .build/Mainboard
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Restore Mainboard's locked environment
        run: uv sync --project .build/Mainboard --locked --no-dev --python 3.14
      - name: Swift Testing and separate-process restart checks
        run: |
          mkdir -p .build/Results
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 900 xcrun swift test --package-path Shared --scratch-path .build/Shared --jobs 4 2>&1 | tee .build/Results/Shared.log
          report=$(mktemp -d "$PWD/.build/Results/Persistence.XXXXXX")
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 300 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe NativePersistenceProbe write "$report/study.store"
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 60 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe read-attempts "$report/study.store"
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 60 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe write-catalog "$report/catalog.store"
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 60 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe read-catalog "$report/catalog.store"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shared-results
          path: .build/Results/
          include-hidden-files: true
          retention-days: 7

  ios:
    name: ${{ matrix.device }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: ['iPhone 18 Pro', 'iPad Pro 11-inch (M5)']
    env:
      SIMULATOR_DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: phvv-me/mainboard
          ref: 7acaf736c8bae16f8b028678384fe83bb728c51b
          path: .build/Mainboard
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Restore Mainboard's locked environment
        run: uv sync --project .build/Mainboard --locked --no-dev --python 3.14
      - name: Restore committed app dependencies
        run: |
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 180 pod install --deployment --project-directory=App
          uv run --project .build/Mainboard --locked --no-sync mainboard apple execute App/UsagiUnagi.xcworkspace --scheme UsagiUnagi --action resolve --derived-data .build/Xcode/iOS
      - name: Shared iOS tests
        if: matrix.device == 'iPhone 18 Pro'
        run: >-
          uv run --project .build/Mainboard --locked --no-sync mainboard apple execute Shared --scheme StudyKit-Package --action test
          --destination "platform=iOS Simulator,name=$SIMULATOR_DEVICE,OS=27.0"
          --derived-data .build/Xcode/Shared --timeout 900
      - name: Hosted iOS tests
        if: matrix.device == 'iPhone 18 Pro'
        run: >-
          uv run --project .build/Mainboard --locked --no-sync mainboard apple execute App/UsagiUnagi.xcworkspace --scheme Tsurukame --action test
          --destination "platform=iOS Simulator,name=$SIMULATOR_DEVICE,OS=27.0"
          --derived-data .build/Xcode/iOS --only-testing Tests --only-testing AppTests
          --setting CODE_SIGNING_ALLOWED=NO --timeout 900
      - name: Review, lesson, settings and dashboard acceptance
        run: >-
          uv run --project .build/Mainboard --locked --no-sync mainboard apple execute App/UsagiUnagi.xcworkspace --scheme UsagiUnagi --action test
          --destination "platform=iOS Simulator,name=$SIMULATOR_DEVICE,OS=27.0"
          --derived-data .build/Xcode/iOS --only-testing AppStoreScreenshots/ReviewFlowTests
          --skip-testing AppStoreScreenshots/ReviewFlowTests/testNativeTabsPreserveWarmStudyLinksAndReturnToStatistics
          --setting CODE_SIGNING_ALLOWED=NO --timeout 1800
      - name: Native warm links
        run: >-
          uv run --project .build/Mainboard --locked --no-sync mainboard apple execute App/UsagiUnagi.xcworkspace --scheme UsagiUnagi --action test
          --destination "platform=iOS Simulator,name=$SIMULATOR_DEVICE,OS=27.0"
          --derived-data .build/Xcode/iOS --url-test App/Tests/WarmLinks.json
          --only-testing AppStoreScreenshots/ReviewFlowTests/testNativeTabsPreserveWarmStudyLinksAndReturnToStatistics
          --setting CODE_SIGNING_ALLOWED=NO --timeout 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.device }}-results
          path: .build/Results/
          include-hidden-files: true
          retention-days: 7

  mac:
    name: Native Mac acceptance
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: phvv-me/mainboard
          ref: 7acaf736c8bae16f8b028678384fe83bb728c51b
          path: .build/Mainboard
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Restore Mainboard's locked environment
        run: uv sync --project .build/Mainboard --locked --no-dev --python 3.14
      - name: Restore unified project integration
        run: uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 180 pod install --deployment --project-directory=App
      - name: Native Mac app and UI tests
        run: >-
          uv run --project .build/Mainboard --locked --no-sync mainboard apple execute App/UsagiUnagi.xcworkspace --scheme UsagiUnagi --action test
          --destination platform=macOS --derived-data .build/Xcode/macOS
          --setting CODE_SIGN_IDENTITY=- --timeout 900
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mac-results
          path: .build/Results/
          include-hidden-files: true
          retention-days: 7
