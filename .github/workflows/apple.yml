name: Apple CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
  SWIFT_TESTING_XCTEST_INTEROP_MODE: complete

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release product (${{ matrix.platform }})
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, mac]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: phvv-me/mainboard
          ref: b72cd6fdd7870842a0cd5a7517231d26e5123eff
          path: .build/Mainboard
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Restore Mainboard's locked environment
        run: uv sync --project .build/Mainboard --locked --no-dev --python 3.14
      - name: Build Release product
        env:
          PRODUCT: ${{ matrix.platform }}
        run: uv run --project .build/Mainboard --locked --no-sync mainboard run --locked "release-$PRODUCT"
      - name: Inspect Release resources, metadata and linked symbols
        env:
          PRODUCT: ${{ matrix.platform }}
        run: >-
          uv run --project .build/Mainboard --locked --no-sync mainboard run --locked "audit-release-$PRODUCT"
          > ".build/Results/Release-$PRODUCT.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-${{ matrix.platform }}
          path: .build/Results/
          include-hidden-files: true
          retention-days: 7

  shared:
    name: Shared logic and persistence
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: phvv-me/mainboard
          ref: b72cd6fdd7870842a0cd5a7517231d26e5123eff
          path: .build/Mainboard
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Restore Mainboard's locked environment
        run: uv sync --project .build/Mainboard --locked --no-dev --python 3.14
      - name: Restore pinned Swift correctness tools
        run: uv run --project .build/Mainboard --locked --no-sync mainboard binary sync
      - name: All first-party Swift parser coverage
        run: |
          mkdir -p .build/Results
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 600 mainboard lint --check --only swift-parse . 2>&1 | tee .build/Results/SwiftParser.log
      - name: Swift format and correctness
        run: |
          uv run --project .build/Mainboard --locked --no-sync mainboard lint --check --only swift-format,swift-ui Shared/Sources App/Application App/UsagiUnagiApp.swift App/WatchHelper.swift
          uv run --project .build/Mainboard --locked --no-sync mainboard lint --check --only swiftlint App Shared/Sources
      - name: SwiftUI and storage migration inventory
        run: |
          mkdir -p .build/Results
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 180 mainboard analyze check . --rule SW-PARSE0001 --rule SW-MIG0001 --rule SW-MIG0002 --rule SW-MIG0003 --rule SW-MIG0004 --rule SW-MIG0005 --rule SW-MIG0006 --rule SW-MIG0007 --rule SW-MIG0008 --rule ALL-MIG0001 | tee .build/Results/SwiftMigration.log
      - name: Swift source and dependency inventory
        run: uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 180 mainboard analyze swift-inventory . --json > .build/Results/SwiftInventory.json
      - name: Native font preview exports
        run: |
          mkdir -p .build/Results
          uv run --project .build/Mainboard --locked --no-sync mainboard apple font-previews App/Resources/fonts --text '色は匂へど散りぬるを我が世誰ぞ常ならん有為の奥山今日越えて浅き夢見じ酔ひもせず' --json | tee .build/Results/FontPreviews.json
      - name: Swift Testing and separate-process restart checks
        run: |
          mkdir -p .build/Results
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 900 xcrun swift test --package-path Shared --scratch-path .build/Shared --jobs 4 2>&1 | tee .build/Results/Shared.log
          report=$(mktemp -d "$PWD/.build/Results/Persistence.XXXXXX")
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 300 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe NativePersistenceProbe write "$report/study.store"
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 60 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe read-attempts "$report/study.store"
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 60 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe write-catalog "$report/catalog.store"
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 60 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe read-catalog "$report/catalog.store"
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 60 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe read-native-baseline App/Tests/PersistenceProbe/Fixtures/native-v0-186c1cc3/study.store
          # Disposable unchanged-schema experiment; not production G7/cutover acceptance.
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 600 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe probe-native-upgrade App/Tests/PersistenceProbe/Fixtures/native-v0-186c1cc3/study.store 2>&1 | tee "$report/native-upgrade.log"
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 600 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe probe-application-opening App/Tests/PersistenceProbe/Fixtures/native-v0-186c1cc3/study.store 2>&1 | tee "$report/application-opening.log"
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 600 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe probe-application-payload-corruption App/Tests/PersistenceProbe/Fixtures/native-v0-186c1cc3/study.store 2>&1 | tee "$report/application-payload-corruption.log"
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 120 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe probe-application-metadata-corruption App/Tests/PersistenceProbe/Fixtures/native-v0-186c1cc3/study.store 2>&1 | tee "$report/application-metadata-corruption.log"
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 120 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe probe-application-adoption-corruption App/Tests/PersistenceProbe/Fixtures/native-v0-186c1cc3/study.store 2>&1 | tee "$report/application-adoption-corruption.log"
          set -o pipefail
          for phase in import-handoff save-handoff activate-handoff; do
            case "$phase" in
              import-handoff) checkpoint="prepared import before credential write" ;;
              save-handoff) checkpoint="saved credential before writer activation" ;;
              activate-handoff) checkpoint="activated writer before preference hydration" ;;
            esac
            handoff_status=0
            uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 60 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe "$phase" "$report/handoff.store" 2>&1 | tee "$report/$phase.log" || handoff_status=$?
            test "$handoff_status" -eq 86
            grep -Fx "CHECKPOINT: $checkpoint" "$report/$phase.log"
          done
          for phase in edit-handoff read-handoff; do
            uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 60 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe "$phase" "$report/handoff.store"
          done
          handoff_status=0
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 60 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe rollback-handoff "$report/rollback.store" || handoff_status=$?
          test "$handoff_status" -eq 86
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 60 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe verify-rollback-handoff "$report/rollback.store"
          selection_status=0
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 60 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe write-native-selection "$report/selection.store" || selection_status=$?
          test "$selection_status" -eq 86
          uv run --project .build/Mainboard --locked --no-sync mainboard proc timeout 60 xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe read-native-selection "$report/selection.store"

      - name: APFS full-volume save and recovery
        run: uv run --project .build/Mainboard --locked --no-sync mainboard run --locked native-store-space

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shared-results
          path: .build/Results/
          include-hidden-files: true
          retention-days: 7

  ios:
    name: ${{ matrix.device }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: ['iPhone 18 Pro', 'iPad Pro 11-inch (M5)']
    env:
      SIMULATOR_DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: phvv-me/mainboard
          ref: b72cd6fdd7870842a0cd5a7517231d26e5123eff
          path: .build/Mainboard
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Restore Mainboard's locked environment
        run: uv sync --project .build/Mainboard --locked --no-dev --python 3.14
      - name: Restore committed app dependencies
        run: |
          uv run --project .build/Mainboard --locked --no-sync mainboard apple execute App/UsagiUnagi.xcworkspace --scheme UsagiUnagi --action resolve --derived-data .build/Xcode/iOS
      - name: Shared iOS tests
        if: matrix.device == 'iPhone 18 Pro'
        run: >-
          uv run --project .build/Mainboard --locked --no-sync mainboard apple execute Shared --scheme StudyKit-Package --action test
          --destination "platform=iOS Simulator,name=$SIMULATOR_DEVICE,OS=27.0"
          --derived-data .build/Xcode/Shared --timeout 900
      - name: Retained watch companion build
        if: matrix.device == 'iPhone 18 Pro'
        run: >-
          uv run --project .build/Mainboard --locked --no-sync mainboard apple execute App/UsagiUnagi.xcworkspace
          --scheme "Tsurukame Complication" --action build --destination "generic/platform=watchOS Simulator"
          --derived-data .build/Xcode/watchOS --setting CODE_SIGNING_ALLOWED=NO --timeout 900
      - name: Hosted iOS tests
        if: matrix.device == 'iPhone 18 Pro'
        run: uv run --project .build/Mainboard --locked --no-sync mainboard run --locked test-app-ios
      - name: Frozen store reopened after saved work and interrupted adoption
        if: matrix.device == 'iPhone 18 Pro'
        run: uv run --project .build/Mainboard --locked --no-sync mainboard run --locked native-store-restart
      - name: Review, lesson, settings and dashboard acceptance
        run: >-
          env -u PROTOC_PATH uv run --project .build/Mainboard --locked --no-sync mainboard apple execute App/UsagiUnagi.xcworkspace --setting=-skipPackagePluginValidation --scheme UsagiUnagi --action test
          --destination "platform=iOS Simulator,name=$SIMULATOR_DEVICE,OS=27.0"
          --derived-data .build/Xcode/iOS --only-testing AppStoreScreenshots/ReviewFlowTests
          --only-testing AppStoreScreenshots/NativeRootFlowTests
          --skip-testing AppStoreScreenshots/ReviewFlowTests/testNativeTabsPreserveWarmStudyLinksAndReturnToStatistics
          --skip-testing AppStoreScreenshots/ReviewFlowTests/testShellFullRefreshKeepsCachedStudyAvailableAfterForeground
          --skip-testing AppStoreScreenshots/ReviewFlowTests/testMaterialConflictRetainsDraftAndHiddenNoteUntilExplicitReplacement
          --skip-testing AppStoreScreenshots/ReviewFlowTests/testMaterialConflictFixtureRejectsUnarmedAndMismatchedEvents
          --skip-testing AppStoreScreenshots/ReviewFlowTests/testMaterialConflictFixtureDoesNotAcknowledgeRejectedCommit
          --setting CODE_SIGNING_ALLOWED=NO --timeout 1800
      - name: Native material conflict events
        run: >-
          env -u PROTOC_PATH uv run --project .build/Mainboard --locked --no-sync mainboard apple execute App/UsagiUnagi.xcworkspace --setting=-skipPackagePluginValidation --scheme UsagiUnagi --action test
          --destination "platform=iOS Simulator,name=$SIMULATOR_DEVICE,OS=27.0"
          --derived-data .build/Xcode/iOS --url-test App/Tests/MaterialConflictEvents.json
          --only-testing AppStoreScreenshots/ReviewFlowTests/testMaterialConflictRetainsDraftAndHiddenNoteUntilExplicitReplacement
          --only-testing AppStoreScreenshots/ReviewFlowTests/testMaterialConflictFixtureRejectsUnarmedAndMismatchedEvents
          --only-testing AppStoreScreenshots/ReviewFlowTests/testMaterialConflictFixtureDoesNotAcknowledgeRejectedCommit
          --setting CODE_SIGNING_ALLOWED=NO --timeout 900
      - name: Native cached refresh across foreground changes
        run: >-
          env -u PROTOC_PATH uv run --project .build/Mainboard --locked --no-sync mainboard apple execute App/UsagiUnagi.xcworkspace --setting=-skipPackagePluginValidation --scheme UsagiUnagi --action test
          --destination "platform=iOS Simulator,name=$SIMULATOR_DEVICE,OS=27.0"
          --derived-data .build/Xcode/iOS --url-test App/Tests/HeldRefresh.json
          --only-testing AppStoreScreenshots/ReviewFlowTests/testShellFullRefreshKeepsCachedStudyAvailableAfterForeground
          --setting CODE_SIGNING_ALLOWED=NO --timeout 600
      - name: Native warm links
        run: >-
          env -u PROTOC_PATH uv run --project .build/Mainboard --locked --no-sync mainboard apple execute App/UsagiUnagi.xcworkspace --setting=-skipPackagePluginValidation --scheme UsagiUnagi --action test
          --destination "platform=iOS Simulator,name=$SIMULATOR_DEVICE,OS=27.0"
          --derived-data .build/Xcode/iOS --url-test App/Tests/WarmLinks.json
          --only-testing AppStoreScreenshots/ReviewFlowTests/testNativeTabsPreserveWarmStudyLinksAndReturnToStatistics
          --setting CODE_SIGNING_ALLOWED=NO --timeout 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.device }}-results
          path: .build/Results/
          include-hidden-files: true
          retention-days: 7

  mac:
    name: Native Mac acceptance
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: phvv-me/mainboard
          ref: b72cd6fdd7870842a0cd5a7517231d26e5123eff
          path: .build/Mainboard
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Restore Mainboard's locked environment
        run: uv sync --project .build/Mainboard --locked --no-dev --python 3.14
      - name: Restore committed app dependencies
        run: uv run --project .build/Mainboard --locked --no-sync mainboard apple execute App/UsagiUnagi.xcworkspace --scheme UsagiUnagi --action resolve --derived-data .build/Xcode/UnifiedMac --timeout 600
      - name: Hosted native Mac unit tests
        run: uv run --project .build/Mainboard --locked --no-sync mainboard run --locked test-app-mac
      - name: Native Mac app and UI tests
        run: >-
          env -u PROTOC_PATH uv run --project .build/Mainboard --locked --no-sync mainboard apple execute App/UsagiUnagi.xcworkspace --setting=-skipPackagePluginValidation --scheme UsagiUnagi --action test
          --destination platform=macOS --derived-data .build/Xcode/UnifiedMac
          --setting CODE_SIGN_IDENTITY=- --timeout 900
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mac-results
          path: .build/Results/
          include-hidden-files: true
          retention-days: 7
