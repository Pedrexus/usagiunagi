# Standalone Apple builds, tests and source checks. The parent owns its multi-language pipeline.
# CI and local checks use the same read-only commands; only swift-format may rewrite Swift.
[workspace]
name = "usagiunagi"
platforms = ["osx-arm64"]

[tasks]
test-app-ios = "env -u PROTOC_PATH mainboard apple execute App/UsagiUnagi.xcworkspace --scheme Tsurukame --action test --destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' --derived-data .build/Xcode/iOS --timeout 900 --only-testing Tests --only-testing AppTests --setting=-skipPackagePluginValidation --setting CODE_SIGNING_ALLOWED=NO"
test-app-mac = "env -u PROTOC_PATH mainboard apple execute App/UsagiUnagi.xcworkspace --scheme Tsurukame --action test --destination platform=macOS --derived-data .build/Xcode/UnifiedMac --timeout 900 --only-testing Tests --only-testing AppTests --setting=-skipPackagePluginValidation --setting CODE_SIGNING_ALLOWED=NO"
native-store-restart = '''mainboard proc timeout 2500 sh -eu -c '
restart_fixture_id=$(/usr/bin/uuidgen)
mkdir -p .build/Results
for phase in seed reopen seedAbrupt reopenAbrupt; do
  phase_log=$(mktemp ".build/Results/NativeRestart.$restart_fixture_id.$phase.XXXXXX")
  printf "Native restart phase %s: %s\\n" "$phase" "$phase_log"
  phase_status=0
  env -u PROTOC_PATH mainboard apple execute App/UsagiUnagi.xcworkspace --scheme NativeStoreRestart --action test --destination "platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0" --derived-data .build/Xcode/iOS --timeout 600 --only-testing AppTests/FrozenNativeStoreTests --setting=-skipPackagePluginValidation --setting CODE_SIGNING_ALLOWED=NO --setting "USAGI_NATIVE_RESTART_PHASE=$phase" --setting "USAGI_NATIVE_RESTART_ID=$restart_fixture_id" > "$phase_log" 2>&1 || phase_status=$?
  cat "$phase_log"
  if [ "$phase" = seedAbrupt ]; then
    test "$phase_status" -eq 65
    /usr/bin/grep -Fq "NATIVE WAL READY FOR ABRUPT EXIT: $restart_fixture_id, PID " "$phase_log"
    /usr/bin/grep -Fq "\"failedTests\": 1, \"skippedTests\": 0, \"expectedFailures\": 0" "$phase_log"
    /usr/bin/grep -Fq "\"testFailures\": [{\"failureText\": \"The test runner exited with code 86 before finishing running tests." "$phase_log"
  else
    test "$phase_status" -eq 0
  fi
done
'
'''
release-ios = "env -u PROTOC_PATH mainboard apple execute App/UsagiUnagi.xcworkspace --scheme UsagiUnagi --action build --configuration Release --destination 'generic/platform=iOS Simulator' --derived-data .build/Xcode/iOS --timeout 900 --setting=-skipPackagePluginValidation --setting CODE_SIGNING_ALLOWED=NO"
release-mac = "env -u PROTOC_PATH mainboard apple execute App/UsagiUnagi.xcworkspace --scheme UsagiUnagi --action build --configuration Release --destination platform=macOS --derived-data .build/Xcode/UnifiedMac --timeout 900 --setting=-skipPackagePluginValidation --setting CODE_SIGNING_ALLOWED=NO"
audit-release-ios = "mainboard proc timeout 120 mainboard apple bundle .build/Xcode/iOS/Build/Products/Release-iphonesimulator/Tsurukame.app --forbid-symbol 'FMDatabase|FMResultSet|FMDB|Hippolyte|PromiseKit' --forbid-resource '**/study.store' --forbid-resource '**/study.store.baseline.plist' --forbid-resource '**/NativeStoreBaseline.swift' --forbid-resource '**/native-v0-186c1cc3' --forbid-resource '**/*.xctest' --forbid-resource '**/*.xctestrun' --expect-info CFBundleDisplayName=usagiunagi --expect-info CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName=UsagiUnagi --require-info NSMicrophoneUsageDescription --expect-name en=usagiunagi --expect-name ja=兔鰻 --expect-name zh-Hans=兔鰻 --expect-name zh-Hant=兔鰻 --json"
audit-release-mac = "mainboard proc timeout 120 mainboard apple bundle .build/Xcode/UnifiedMac/Build/Products/Release/Tsurukame.app --forbid-symbol 'FMDatabase|FMResultSet|FMDB|Hippolyte|PromiseKit' --forbid-resource '**/study.store' --forbid-resource '**/study.store.baseline.plist' --forbid-resource '**/NativeStoreBaseline.swift' --forbid-resource '**/native-v0-186c1cc3' --forbid-resource '**/*.xctest' --forbid-resource '**/*.xctestrun' --expect-info CFBundleDisplayName=usagiunagi --expect-info CFBundleIconName=UsagiUnagi --require-info NSMicrophoneUsageDescription --expect-name en=usagiunagi --expect-name ja=兔鰻 --expect-name zh-Hans=兔鰻 --expect-name zh-Hant=兔鰻 --json"

# Official release asset coordinates; explicit setup: `mainboard binary sync`.
[on.osx.binary.dev]
swiftlint = { version = "0.65.1", url = "https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip", sha256 = "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0", member = "swiftlint" }

[lint]
exclude = ["**/Pods/**", "**/Generated/**", "**/.build/**", "**/.mainboard/**", "**/Vendor/**"]

# Parse every kept first-party Swift file independently of gradual style adoption.
[lint.tools.swift-parse]
check = "mainboard analyze gate --rule SW-PARSE0001 {files}"
files = ["*.swift"]
exclude = ["**/Pods/**", "**/Generated/**", "**/.build/**", "**/.mainboard/**", "**/Vendor/**"]
serial = true
timeout = 600

[lint.tools.swift-ui]
check = "mainboard analyze gate --rule SW-UI0001 --rule SW-UI0002 --rule SW-UI0003 --rule SW-UI0004 --rule SW-PARSE0001 {files}"
files = ["*.swift"]
exclude = ["**/Pods/**", "**/Generated/**", "**/.build/**", "**/Vendor/**"]
serial = true
timeout = 600

[lint.tools.swift-format]
check = "/usr/bin/xcrun swift format lint --strict {files}"
fix = "/usr/bin/xcrun swift format format --in-place {files}"
files = ["*.swift"]

[lint.tools.swiftlint]
check = "{root}/.mainboard/envs/default/binary/bin/swiftlint lint --strict --quiet --no-cache --force-exclude -- {files}"
files = ["*.swift"]
timeout = 120
