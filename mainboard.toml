# Standalone Apple builds, tests and source checks. The parent owns its multi-language pipeline.
# CI and local checks use the same read-only commands; only swift-format may rewrite Swift.
[workspace]
name = "usagiunagi"
platforms = ["osx-arm64"]

[tasks]
setup = "mainboard binary sync"
lint = "mainboard proc timeout 600 mainboard lint --check ."
test = "mainboard proc timeout 900 /usr/bin/xcrun swift test --package-path Shared --scratch-path .build/Shared --jobs 4"
build = "mainboard apple execute App/UsagiUnagi.xcworkspace --scheme UsagiUnagi --action build --configuration Debug --destination 'generic/platform=iOS Simulator' --derived-data .build/Xcode/iOS --timeout 900 --setting CODE_SIGNING_ALLOWED=NO"
# Native compilation includes type checking; use the same product and toolchain.
typecheck = "mainboard run --locked build"
build-watch = "mainboard apple execute App/UsagiUnagi.xcworkspace --scheme 'Tsurukame Complication' --action build --configuration Debug --destination 'generic/platform=watchOS Simulator' --derived-data .build/Xcode/Watch --timeout 900 --setting CODE_SIGNING_ALLOWED=NO"
native-v1-values = '''mainboard proc timeout 600 sh -eu -c '
frozen_fixture=App/Tests/PersistenceProbe/Fixtures/native-v0-186c1cc3
/usr/bin/shasum -a 256 -c "$frozen_fixture/writer-sources.sha256"
mkdir -p .build/Results
frozen_report=$(mktemp -d ".build/Results/FrozenValues.XXXXXX")
frozen_build=".build/FrozenValues/${frozen_report##*/}"
/usr/bin/ditto -x -k "$frozen_fixture/writer-sources.zip" "$frozen_report"
/usr/bin/ditto -x -k "$frozen_fixture/baseline-reader.zip" "$frozen_report"
cp App/Tests/PersistenceProbe/HistoricalValues/Package.swift "$frozen_report/"
cp -R App/Tests/PersistenceProbe/HistoricalValues/Reader "$frozen_report/Reader"
cp "$frozen_report/App/Tests/PersistenceProbe/Sources/NativePersistenceProbe/NativeStoreBaseline.swift" "$frozen_report/Reader/"
/usr/bin/xcrun swift build --package-path "$frozen_report" --scratch-path "$frozen_build" --jobs 2 > "$frozen_report/build.log" 2>&1 || { cat "$frozen_report/build.log"; exit 1; }
frozen_binary=$(/usr/bin/xcrun swift build --package-path "$frozen_report" --scratch-path "$frozen_build" --show-bin-path)/HistoricalNativeValues
for frozen_pass in 1 2; do
  "$frozen_binary" "$frozen_fixture/study.store" > "$frozen_report/read-$frozen_pass.log" 2>&1 || { cat "$frozen_report/read-$frozen_pass.log"; exit 1; }
  cat "$frozen_report/read-$frozen_pass.log"
done
frozen_value_source="$frozen_report/Shared/Sources/StudyCore/StudySession.swift"
cp "$frozen_value_source" "$frozen_report/original-session.swift"
printf "\n// Intentional source-integrity negative control.\n" >> "$frozen_value_source"
frozen_status=0
"$frozen_binary" "$frozen_fixture/study.store" > "$frozen_report/changed-source.log" 2>&1 || frozen_status=$?
test "$frozen_status" -eq 74
/usr/bin/grep -Fq "Historical source bytes differ from the frozen writer" "$frozen_report/changed-source.log"
mv "$frozen_report/original-session.swift" "$frozen_value_source"
frozen_extra="$frozen_report/Shared/Sources/StudyCore/UnexpectedHistoricalSource.swift"
printf "// Intentional compiler-closure negative control.\n" > "$frozen_extra"
frozen_status=0
"$frozen_binary" "$frozen_fixture/study.store" > "$frozen_report/extra-source.log" 2>&1 || frozen_status=$?
test "$frozen_status" -eq 74
/usr/bin/grep -Fq "Historical compiler source closure differs from the writer" "$frozen_report/extra-source.log"
rm "$frozen_extra"
printf "PASS: changed source and expanded compiler closure refused before store opening\n"
/usr/bin/shasum -a 256 -c "$frozen_fixture/writer-sources.sha256"
printf "FROZEN VALUES REPORT: %s\n" "$frozen_report"
'
'''
test-app-ios = "mainboard apple execute App/UsagiUnagi.xcworkspace --scheme Tsurukame --action test --destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' --derived-data .build/Xcode/iOS --timeout 900 --only-testing AppTests --setting CODE_SIGNING_ALLOWED=NO"
test-app-mac = "mainboard apple execute App/UsagiUnagi.xcworkspace --scheme Tsurukame --action test --destination platform=macOS --derived-data .build/Xcode/UnifiedMac --timeout 900 --only-testing AppTests --setting CODE_SIGNING_ALLOWED=NO"
native-store-restart = '''mainboard proc timeout 2500 sh -eu -c '
restart_fixture_id=$(/usr/bin/uuidgen)
mkdir -p .build/Results
for phase in seed reopen seedAbrupt reopenAbrupt seedVerification reopenVerification seedCandidate reopenCandidate seedBeforeAnswer reopenBeforeAnswer retryBeforeAnswer verifyBeforeAnswer; do
  phase_log=$(mktemp ".build/Results/NativeRestart.$restart_fixture_id.$phase.XXXXXX")
  printf "Native restart phase %s: %s\\n" "$phase" "$phase_log"
  test_scope=AppTests/FrozenNativeStoreTests
  case "$phase" in
    seedVerification|reopenVerification|seedCandidate|reopenCandidate|seedBeforeAnswer|reopenBeforeAnswer|retryBeforeAnswer|verifyBeforeAnswer)
      test_scope="$test_scope/persistedStoreReopensInAnotherTestHost()" ;;
  esac
  phase_status=0
  mainboard apple execute App/UsagiUnagi.xcworkspace --scheme NativeStoreRestart --action test --destination "platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0" --derived-data .build/Xcode/iOS --timeout 600 --only-testing "$test_scope" --setting CODE_SIGNING_ALLOWED=NO --setting "USAGI_NATIVE_RESTART_PHASE=$phase" --setting "USAGI_NATIVE_RESTART_ID=$restart_fixture_id" > "$phase_log" 2>&1 || phase_status=$?
  cat "$phase_log"
  if [ "$phase" = seedAbrupt ] || [ "$phase" = seedVerification ] || [ "$phase" = seedCandidate ] || [ "$phase" = seedBeforeAnswer ]; then
    test "$phase_status" -eq 65
    case "$phase" in
      seedAbrupt) marker="NATIVE WAL READY FOR ABRUPT EXIT: $restart_fixture_id, PID " ;;
      seedVerification) marker="NATIVE OPENING READY FOR ABRUPT EXIT: $restart_fixture_id, verification, PID " ;;
      seedCandidate) marker="NATIVE OPENING READY FOR ABRUPT EXIT: $restart_fixture_id, candidate, PID " ;;
      seedBeforeAnswer) marker="NATIVE REVIEW READY FOR ABRUPT EXIT: $restart_fixture_id, PID " ;;
    esac
    /usr/bin/grep -Fq "$marker" "$phase_log"
    /usr/bin/grep -Fq "\"failedTests\": 1, \"skippedTests\": 0, \"expectedFailures\": 0" "$phase_log"
    /usr/bin/grep -Fq "\"testFailures\": [{\"failureText\": \"The test runner exited with code 86 before finishing running tests." "$phase_log"
  else
    test "$phase_status" -eq 0
  fi
done
'
'''
native-store-space = { run = "mainboard run --locked native-store-volume", env = { USAGI_NATIVE_SPACE_BACKEND = "mac" } }
native-store-volume-access-ios = { run = "mainboard run --locked native-store-volume", env = { USAGI_NATIVE_SPACE_BACKEND = "ios-access" } }
native-store-space-ios = { run = "mainboard run --locked native-store-volume", env = { USAGI_NATIVE_SPACE_BACKEND = "ios-matrix" } }
native-store-volume = '''mainboard proc timeout 2400 sh -eu -c '
case "${USAGI_NATIVE_SPACE_BACKEND:-}" in mac|ios-access|ios-save|ios-review|ios-review-wal|ios-opening|ios-matrix) ;; *) exit 2 ;; esac
mkdir -p .build/Results
space_report=$(mktemp -d .build/Results/StorageSpace.XXXXXX)
space_root=$(mktemp -d /private/tmp/usagi-disk-space.XXXXXX)
space_image="$space_root/storage.asif"
space_mount="$space_root/volume"
space_device=""
cleanup() {
  space_status=$?
  trap - EXIT
  if [ -n "$space_device" ]; then
    if ! mainboard proc timeout 60 /usr/sbin/diskutil eject "$space_device" > "$space_report/detach.log" 2>&1; then
      cat "$space_report/detach.log"
      exit 1
    fi
  fi
  if [ "$space_status" -eq 0 ]; then
    /bin/rm "$space_image"
    /bin/rmdir "$space_root"
  fi
  exit "$space_status"
}
trap cleanup EXIT
trap "exit 130" INT
trap "exit 143" TERM
if [ "$USAGI_NATIVE_SPACE_BACKEND" = mac ]; then
  /usr/bin/xcrun swift build --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --jobs 2
fi
/usr/sbin/diskutil image create blank --format ASIF --size 128m --volumeName UsagiStorageFixture "$space_image" > "$space_report/create.log" 2>&1
/usr/sbin/diskutil image attach --nobrowse --mountPoint "$space_mount" --plist "$space_image" > "$space_report/attach.plist"
space_device=$(/usr/libexec/PlistBuddy -c "Print :system-entities:0:dev-entry" "$space_report/attach.plist")
case "$space_device" in disk[0-9]*) ;; *) exit 1 ;; esac
if [ "$USAGI_NATIVE_SPACE_BACKEND" != mac ]; then
  space_id=$(/usr/bin/uuidgen)
  printf "%s" "$space_id" > "$space_mount/.native-access-id"
  space_phases="spaceAccess"
  if [ "$USAGI_NATIVE_SPACE_BACKEND" = ios-save ]; then
    space_phases="spaceSave spaceReopen spaceVerify"
  elif [ "$USAGI_NATIVE_SPACE_BACKEND" = ios-review ]; then
    space_phases="spaceReview spaceReopen spaceVerify"
  elif [ "$USAGI_NATIVE_SPACE_BACKEND" = ios-review-wal ]; then
    space_phases="spaceReviewWAL spaceReopen spaceVerify"
  elif [ "$USAGI_NATIVE_SPACE_BACKEND" = ios-opening ]; then
    space_phases="spaceOpening spaceOpeningRetry spaceOpeningReopen spaceOpeningVerify"
  elif [ "$USAGI_NATIVE_SPACE_BACKEND" = ios-matrix ]; then
    space_phases="spaceMatrix spaceMatrixReopen spaceMatrixVerify spaceOpening spaceOpeningRetry spaceOpeningReopen spaceOpeningVerify"
  fi
  for space_phase in $space_phases; do
    mainboard apple execute App/UsagiUnagi.xcworkspace --scheme NativeStoreRestart --action test --destination "platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0" --derived-data .build/Xcode/iOS --timeout 480 --only-testing "AppTests/FrozenNativeStoreTests/persistedStoreReopensInAnotherTestHost()" --setting CODE_SIGNING_ALLOWED=NO --setting "USAGI_NATIVE_RESTART_PHASE=$space_phase" --setting "USAGI_NATIVE_RESTART_ID=$space_id" --setting "USAGI_NATIVE_SPACE_PATH=$space_mount" > "$space_report/$space_phase.log" 2>&1
  done
  if [ "$USAGI_NATIVE_SPACE_BACKEND" = ios-access ]; then
    cp "$space_mount/$space_id.access.plist" "$space_report/access.plist"
    test "$(/usr/bin/plutil -extract id raw -o - "$space_report/access.plist")" = "$space_id"
    test "$(/usr/bin/plutil -extract records raw -o - "$space_report/access.plist")" -eq 38
  else
    space_saves="save"
    if [ "$USAGI_NATIVE_SPACE_BACKEND" = ios-matrix ]; then
      space_saves="spaceSave spaceReview spaceReviewWAL spaceOpening spaceVerification spaceOpeningWAL spaceVerificationWAL"
    elif [ "$USAGI_NATIVE_SPACE_BACKEND" = ios-opening ]; then
      space_saves="spaceOpening spaceVerification spaceOpeningWAL spaceVerificationWAL"
    fi
    for space_save in $space_saves; do
      space_suffix=""
      if [ "$space_save" != save ]; then space_suffix=".$space_save"; fi
      space_receipt="$space_report/$space_save.plist"
      cp "$space_mount/$space_id$space_suffix.save.plist" "$space_receipt"
      test "$(/usr/bin/plutil -extract id raw -o - "$space_receipt")" = "$space_id"
      case "$space_save" in
      spaceOpening*|spaceVerification*)
        space_error=$(/usr/bin/plutil -extract errorDomain raw -o - "$space_receipt")
        space_code=$(/usr/bin/plutil -extract errorCode raw -o - "$space_receipt")
        case "$space_save" in
          spaceOpening*) test "$space_error:$space_code" = NSCocoaErrorDomain:640 ;;
          *)
            case "$space_error:$space_code" in
              NSCocoaErrorDomain:640|NSPOSIXErrorDomain:28) ;;
              *) case "$(/usr/bin/plutil -extract sqliteCode raw -o - "$space_receipt")" in 13|4618) ;; *) exit 1 ;; esac ;;
            esac ;;
        esac
        space_pids=" "
        for space_role in producerPID retryPID readerPID verifierPID; do
          space_pid=$(/usr/bin/plutil -extract "$space_role" raw -o - "$space_receipt")
          test "$space_pid" -gt 0
          case "$space_pids" in *" $space_pid "*) exit 1 ;; esac
          space_pids="$space_pids$space_pid "
        done
        ;;
      *)
        case "$(/usr/bin/plutil -extract sqliteCode raw -o - "$space_receipt")" in 13|4618) ;; *) exit 1 ;; esac
        ;;
      esac
      test "$(/usr/bin/plutil -extract filledBytes raw -o - "$space_receipt")" -gt 0
      if [ "$space_save" = spaceReview ] || [ "$space_save" = spaceReviewWAL ] || [ "$USAGI_NATIVE_SPACE_BACKEND" = ios-review ] || [ "$USAGI_NATIVE_SPACE_BACKEND" = ios-review-wal ]; then
        test "$(/usr/bin/plutil -extract review.subjectID raw -o - "$space_receipt")" -eq 42
        test "$(/usr/bin/plutil -extract review.meaningWrongCount raw -o - "$space_receipt")" -eq 1
      fi
      case "$space_save:$USAGI_NATIVE_SPACE_BACKEND" in
        spaceReviewWAL:*|spaceOpeningWAL:*|spaceVerificationWAL:*|*:ios-review-wal)
          /usr/bin/plutil -extract source xml1 -o "$space_report/$space_save.source.plist" "$space_receipt"
          /usr/libexec/PlistBuddy -c "Print :study.store-wal" "$space_report/$space_save.source.plist" > /dev/null
          ;;
      esac
    done
  fi
  printf "IPHONE VOLUME REPORT: %s\\n" "$space_report"
  exit 0
fi
mkdir "$space_mount/frozen"
cp App/Tests/PersistenceProbe/Fixtures/native-v0-186c1cc3/study.store App/Tests/PersistenceProbe/Fixtures/native-v0-186c1cc3/study.store.baseline.plist "$space_mount/frozen/"
space_result=0
/usr/bin/xcrun swift run --package-path App/Tests/PersistenceProbe --scratch-path .build/Probe --skip-build NativePersistenceProbe probe-application-space "$space_mount/frozen/study.store" > "$space_report/probe.log" 2>&1 || space_result=$?
cat "$space_report/probe.log"
test "$space_result" -eq 0
space_outcomes=0
for space_outcome in "$space_mount"/native-upgrade-*/*.space.plist; do
  test -f "$space_outcome"
  cp "$space_outcome" "$space_report/"
  space_outcomes=$((space_outcomes + 1))
done
test "$space_outcomes" -eq 10
printf "SPACE REPORT: %s\\n" "$space_report"
'
'''
release-ios = "mainboard apple execute App/UsagiUnagi.xcworkspace --scheme UsagiUnagi --action build --configuration Release --destination 'generic/platform=iOS Simulator' --derived-data .build/Xcode/iOS --timeout 900 --setting CODE_SIGNING_ALLOWED=NO"
release-mac = "mainboard apple execute App/UsagiUnagi.xcworkspace --scheme UsagiUnagi --action build --configuration Release --destination platform=macOS --derived-data .build/Xcode/UnifiedMac --timeout 900 --setting CODE_SIGNING_ALLOWED=NO"
audit-release-ios = "mainboard proc timeout 120 mainboard apple bundle .build/Xcode/iOS/Build/Products/Release-iphonesimulator/Tsurukame.app --forbid-symbol 'FMDatabase|FMResultSet|FMDB|Hippolyte|PromiseKit' --forbid-resource '**/study.store' --forbid-resource '**/study.store.baseline.plist' --forbid-resource '**/NativeStoreBaseline.swift' --forbid-resource '**/native-v0-186c1cc3' --forbid-resource '**/*.xctest' --forbid-resource '**/*.xctestrun' --expect-info CFBundleDisplayName=usagiunagi --expect-info CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName=UsagiUnagi --require-info NSMicrophoneUsageDescription --expect-name en=usagiunagi --expect-name ja=兔鰻 --expect-name zh-Hans=兔鰻 --expect-name zh-Hant=兔鰻 --json"
audit-release-mac = "mainboard proc timeout 120 mainboard apple bundle .build/Xcode/UnifiedMac/Build/Products/Release/Tsurukame.app --forbid-symbol 'FMDatabase|FMResultSet|FMDB|Hippolyte|PromiseKit' --forbid-resource '**/study.store' --forbid-resource '**/study.store.baseline.plist' --forbid-resource '**/NativeStoreBaseline.swift' --forbid-resource '**/native-v0-186c1cc3' --forbid-resource '**/*.xctest' --forbid-resource '**/*.xctestrun' --expect-info CFBundleDisplayName=usagiunagi --expect-info CFBundleIconName=UsagiUnagi --require-info NSMicrophoneUsageDescription --expect-name en=usagiunagi --expect-name ja=兔鰻 --expect-name zh-Hans=兔鰻 --expect-name zh-Hant=兔鰻 --json"

[on.osx.env]
# Native lint and tasks share Xcode; an explicit shell/CI selection takes precedence.
DEVELOPER_DIR = "{{ env('DEVELOPER_DIR', '/Applications/Xcode.app/Contents/Developer') }}"

# Official release asset coordinates; explicit setup: `mainboard binary sync`.
[on.osx.binary.dev]
swiftlint = { version = "0.65.1", url = "https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip", sha256 = "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0", member = "swiftlint" }

[lint]
exclude = ["**/.build/**", "**/.mainboard/**"]

# Parse every kept first-party Swift file independently of gradual style adoption.
# Native checks activate the declared environment without installing tools or resolving deps.
[lint.tools.swift-parse]
check = "mainboard run --locked --no-install mainboard analyze gate --rule SW-PARSE0001 {files}"
files = ["*.swift"]
exclude = ["**/.build/**", "**/.mainboard/**"]
serial = true
timeout = 600

[lint.tools.swift-ui]
check = "mainboard run --locked --no-install mainboard analyze gate --rule SW-UI0001 --rule SW-UI0002 --rule SW-UI0003 --rule SW-UI0004 --rule SW-PARSE0001 {files}"
files = ["*.swift"]
exclude = ["**/.build/**", "**/.mainboard/**"]
serial = true
timeout = 600

[lint.tools.swift-format]
check = "mainboard run --locked --no-install /usr/bin/xcrun swift format lint --strict {files}"
fix = "mainboard run --locked --no-install /usr/bin/xcrun swift format format --in-place {files}"
files = ["*.swift"]

[lint.tools.swiftlint]
check = "mainboard run --locked --no-install {root}/.mainboard/envs/default/binary/bin/swiftlint lint --strict --quiet --no-cache --force-exclude -- {files}"
files = ["*.swift"]
timeout = 120
